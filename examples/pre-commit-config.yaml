# ADVANCED — most developers should use Cursor MCP instead:
#   bash scripts/install-cursor.sh
#
# Example pre-commit config for application repos that still want a git hook.
# Pin `rev` to a full commit SHA of pulumamidi-harsha/agentic-quality-gate.

repos:
  - repo: https://github.com/pulumamidi-harsha/agentic-quality-gate
    rev: main # replace with full SHA
    hooks:
      - id: agentic-quality-gate
        # Advisory by default (does not block commit). For blocking:
        # args: [--staged, --strict]

  # Alternative: local path when you clone the hub next to the app
  # - repo: local
