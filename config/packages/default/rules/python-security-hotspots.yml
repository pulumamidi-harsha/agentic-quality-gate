# Python security hotspots (Sonar-parity) — works when registry packs miss plain patterns.
rules:
  - id: agentic.python.security.eval-exec
    message: >
      Dynamic code execution (eval/exec) is a security hotspot — untrusted input
      can lead to remote code execution.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-95"]
      agentic_fix: |
        (1) Prefer ast.literal_eval for literals (2) use a whitelist dispatcher
        (3) never pass request/user input into eval/exec
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: agentic.python.security.subprocess-shell
    message: >
      subprocess with shell=True is a command-injection hotspot. Prefer argument
      lists without a shell.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-78"]
      agentic_fix: |
        (1) Use subprocess.run(["cmd", arg], shell=False)
        (2) Never interpolate user input into a shell string
    patterns:
      - pattern-either:
          - pattern: subprocess.$METHOD(..., shell=True, ...)
          - pattern: subprocess.$METHOD($CMD, shell=True)
      - metavariable-regex:
          metavariable: $METHOD
          regex: (run|call|Popen|check_output|check_call)

  - id: agentic.python.security.pickle-load
    message: >
      pickle / yaml.load on untrusted data enables code execution. Use
      json / yaml.safe_load instead.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-502"]
      agentic_fix: |
        (1) Prefer json.loads (2) for YAML use yaml.safe_load
        (3) never unpickle untrusted bytes
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: yaml.load(...)

  - id: agentic.python.security.weak-hash
    message: >
      MD5 / SHA-1 are weak for security-sensitive hashing. Use hashlib.sha256+
      or a password KDF (bcrypt / argon2).
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: ["CWE-328"]
      agentic_fix: |
        (1) hashlib.sha256(...) for integrity (2) bcrypt/argon2 for passwords
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
