# Default quality-gate package (org standard PR quality/security).
# Metrics jobs load this file — do not wire one-off scanners in callers.
#
# Engines produce findings → schemas/finding.schema.json → quality-gate.yml policy.
# Semgrep: language packs (top enterprise stacks) + always_packs + local hotspot rules.

name: default
description: >
  Org-scale PR quality package for ~10k repos: multi-language SAST, Actions
  hygiene, Sonar-style duplication %, complexity, and changed-file coverage.

engines:
  semgrep:
    enabled: true
    language_packs: true
    # Always run (language-agnostic / org hygiene)
    always_packs:
      - p/security-audit
      - p/secrets
      - p/owasp-top-ten
      - p/github-actions
    # Local hotspot rules (Sonar-parity) — directory scanned as a config root
    local_rules:
      - config/packages/default/rules

  duplication:
    enabled: true
    engine: jscpd
    # Sonar default: Duplicated Lines (%) on New Code ≤ 3
    max_pct_new_code: 3

  complexity:
    enabled: true
    engine: lizard
    threshold: 15

  coverage:
    enabled: true
    threshold_pct: 80
